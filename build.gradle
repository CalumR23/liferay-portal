import de.undercouch.gradle.tasks.download.Download

import org.gradle.internal.os.OperatingSystem

buildscript {
	repositories {
		if (System.getenv("JENKINS_HOME")) {
			ivy {
				layout "gradle"
				url ".ivy"
			}
		}
		else {
			maven {
				url "https://cdn.lfrs.sl/repository.liferay.com/nexus/content/groups/public"
			}

			maven {
				url "https://plugins.gradle.org/m2/"
			}
		}
	}

	dependencies {
		classpath group: "com.liferay", name: "com.liferay.gradle.plugins.poshi.runner", version: "1.0.10"
		classpath group: "de.undercouch", name: "gradle-download-task", version: "3.2.0"
		classpath group: "net.saliman", name: "gradle-properties-plugin", version: "1.4.6"
		classpath group: "com.liferay", name: "com.liferay.gradle.plugins.source.formatter", version: "2.2.0"
		classpath group: "org.ysb33r.gradle", name: "ivypot", version: "0.4"
	}
}

apply plugin: "com.liferay.source.formatter"
apply plugin: "net.saliman.properties"

ext {
	if (!project.hasProperty("operatingSystem")) {
		StringBuilder sb = new StringBuilder()

		OperatingSystem operatingSystem = OperatingSystem.current()

		if (operatingSystem.isLinux()) {
			sb.append("linux")
		}
		else if (operatingSystem.isMacOsX()) {
			sb.append("mac")
		}
		else if (operatingSystem.isWindows()) {
			sb.append("windows")
		}
		else {
			throw new IllegalStateException("Unsupported operating system")
		}

		if (operatingSystem.toString().contains("64")) {
			sb.append("64")
		}
		else {
			sb.append("32")
		}

		operatingSystem = sb.toString()
	}
}

if (browser == "internet.explorer" && !operatingSystem.contains("win")) {
	throw new IllegalStateException("Internet Explorer is not supported on your operating system")
}

File webDriverRootDir = file("${buildDir}/webdriver")

task downloadInternetExplorerDriver(type: Download) {
	def parseMajorVersion = { version ->
		def matcher = version =~ /^([0-9]+)\.([0-9]+).*/

		if (!matcher.matches()) {
			throw new IllegalArgumentException("${version} is not a valid version string")
		}

		return "${matcher.group(1)}.${matcher.group(2)}"
	}

	String ieDriverServerOs

	if (operatingSystem == "win64") {
		ieDriverServerOs = "x64"
	}
	else {
		ieDriverServerOs = "Win32"
	}

	src "http://selenium-release.storage.googleapis.com/${parseMajorVersion(seleniumVersion)}/IEDriverServer_${ieDriverServerOs}_${seleniumVersion}.zip"
	dest file("${webDriverRootDir}/iedriver/${seleniumVersion}/${operatingSystem}/IEDriverServer_${ieDriverServerOs}_${seleniumVersion}.zip")
	overwrite false
}

task unzipInternetExplorerDriver(type: Copy, dependsOn: downloadInternetExplorerDriver) {
	from zipTree(downloadInternetExplorerDriver.dest)
	into file("${webDriverRootDir}/iedriver/${seleniumVersion}/${operatingSystem}")
}

task downloadChromeDriver(type: Download) {
	src "https://chromedriver.storage.googleapis.com/${chromeDriverVersion}/chromedriver_${operatingSystem}.zip"
	dest file("${webDriverRootDir}/chromedriver/${chromeDriverVersion}/${operatingSystem}/chromedriver.zip")
	overwrite false
}

task unzipChromeDriver(type: Copy, dependsOn: downloadChromeDriver) {
	from zipTree(downloadChromeDriver.dest)
	into file("${webDriverRootDir}/chromedriver/${chromeDriverVersion}/${operatingSystem}")
}

task cleanWebDriver(type: Delete) {
	delete webDriverRootDir
}

allprojects {
	apply plugin: "net.saliman.properties"
	apply plugin: "org.ysb33r.ivypot"

	syncRemoteRepositories {
		doFirst {
			configurations*.resolve()
		}

		includeBuildScriptDependencies = true

		outputs.upToDateWhen {
			false
		}

		repoRoot = rootProject.file(".ivy")

		repositories {
			maven {
				url "https://cdn.lfrs.sl/repository.liferay.com/nexus/content/groups/public"
			}

			maven {
				url "https://plugins.gradle.org/m2/"
			}
		}
	}
}

subprojects {
	apply plugin: "com.liferay.poshi.runner"

	if (browser == "internet.explorer") {
		runPoshi.dependsOn unzipInternetExplorerDriver
	}
	else if (browser == "chrome") {
		runPoshi.dependsOn unzipChromeDriver
	}

	task syncSikuliComplete(type: Copy)

	clean {
		delete "test.case.method.names.properties"
		delete "test.generated.properties"
		delete "test-results"
		delete "tests"

		dependsOn cleanWebDriver
	}

	configurations {
		poshiRunner {
			resolutionStrategy {
				force group: "com.google.guava", name: "guava", version: "16.0.1"
				force group: "commons-codec", name: "commons-codec", version: "1.10"
			}
		}

		sikuliComplete
	}

	poshiRunner {
		def getCustomProperties = { String prefix, Project project ->
			Properties properties = new Properties()

			List<String> testPropertiesFileNames = [ "${prefix}.properties" ].asList()

			if (System.env.HOSTNAME) {
				testPropertiesFileNames << "${prefix}.${System.env.HOSTNAME}.properties"
			}

			if (System.env.HOST) {
				testPropertiesFileNames << "${prefix}.${System.env.HOST}.properties"
			}

			if (System.env.COMPUTERNAME) {
				testPropertiesFileNames << "${prefix}.${System.env.COMPUTERNAME}.properties"
			}

			if (System.env.USER) {
				testPropertiesFileNames << "${prefix}.${System.env.USER}.properties"
			}

			for (String testPropertiesFileName in testPropertiesFileNames) {
				File testPropertiesFile = file("${project.projectDir}/${testPropertiesFileName}")

				if (testPropertiesFile.exists()) {
					properties << GUtil.loadProperties(testPropertiesFile)
				}
			}

			return properties
		}

		def getTestProperties = { Project project ->
			Properties properties = new Properties()

			properties << getCustomProperties("test", rootProject)

			if (project != rootProject) {
				properties << getCustomProperties("test", project)
			}

			return properties
		}

		baseDir = "test/functional"
		poshiProperties << getTestProperties(project)
		poshiProperties.put("browser.type", browser.replaceAll("\\.", ""))
		poshiPropertiesFile = rootProject.file("test.properties")
		openCVVersion = "2.4.10-0.10"
		version = "1.0.56"

		if (browser == "chrome") {
			poshiProperties.put("selenium.executable.dir.name", "${unzipChromeDriver.destinationDir}${File.separator}")
			poshiProperties.put("selenium.chrome.driver.executable", "chromedriver")
		}
		else if (browser == "internet.explorer") {
			poshiProperties.put("selenium.executable.dir.name", "${unzipInternetExplorerDriver.destinationDir}${File.separator}")
			poshiProperties.put("selenium.ie.driver.executable", "IEDriverServer.exe")
		}
	}

	dependencies {
		["x86", "x86_64"].each {
			sikuliComplete classifier: "linux-${it}", group: "org.bytedeco.javacpp-presets", name: "opencv", version: poshiRunner.openCVVersion
			sikuliComplete classifier: "windows-${it}", group: "org.bytedeco.javacpp-presets", name: "opencv", version: poshiRunner.openCVVersion
		}

		sikuliComplete classifier: "macosx-x86_64", group: "org.bytedeco.javacpp-presets", name: "opencv", version: poshiRunner.openCVVersion
	}

	repositories {
		if (System.getenv("JENKINS_HOME")) {
			ivy {
				layout "gradle"
				url rootProject.file(".ivy")
			}
		}
		else {
			maven {
				url "https://cdn.lfrs.sl/repository.liferay.com/nexus/content/groups/public"
			}
		}
	}

	syncRemoteRepositories {
		finalizedBy syncSikuliComplete
	}

	syncSikuliComplete {
		from configurations.sikuliComplete
		into rootProject.file(".ivy/org.bytedeco.javacpp-presets/opencv/${poshiRunner.openCVVersion}")
	}
}

repositories {
	maven {
		url "https://cdn.lfrs.sl/repository.liferay.com/nexus/content/groups/public"
	}
}