ext {
    getCustomProperties = { String prefix, Project project ->
        Properties properties = new Properties()

        List<String> testPropertiesFileNames = [ "${prefix}.properties" ].asList()

        if (System.env.HOSTNAME) {
            testPropertiesFileNames << "${prefix}.${System.env.HOSTNAME}.properties"
        }

        if (System.env.HOST) {
            testPropertiesFileNames << "${prefix}.${System.env.HOST}.properties"
        }

        if (System.env.COMPUTERNAME) {
            testPropertiesFileNames << "${prefix}.${System.env.COMPUTERNAME}.properties"
        }

        if (System.env.USER) {
            testPropertiesFileNames << "${prefix}.${System.env.USER}.properties"
        }

        for (String testPropertiesFileName in testPropertiesFileNames) {
            File testPropertiesFile = file("${project.projectDir}/${testPropertiesFileName}")

            if (testPropertiesFile.exists()) {
                properties << GUtil.loadProperties(testPropertiesFile)
            }
        }

        logger.debug("Properties from ${prefix}.*.properties files")
        logger.debug(properties.toString())

        return properties
    }

    getTestProperties = { Project project ->
        Properties properties = new Properties()

        properties << ext.getCustomProperties("test", rootProject)

        if (project != rootProject) {
            properties << ext.getCustomProperties("test", project)
        }

        return properties
    }

    parseMajorVersion = { version ->
        def matcher = version =~ /^([0-9]+)\.([0-9]+).*/

        if (!matcher.matches()) {
            throw new IllegalArgumentException("${version} is not a valid version string")
        }

        return "${matcher.group(1)}.${matcher.group(2)}"
    }
}
